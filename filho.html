<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian - Rastreador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d23;
            --primary: #ff3344;
            --text: #ffffff;
            --text-dim: #8e949e;
            --success: #00ff88;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .status-card {
            background: var(--card);
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2e37;
        }

        .info-row:last-child { border: none; margin: 0; padding: 0; }

        .label { color: var(--text-dim); font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .value { font-weight: 600; color: var(--success); }
        .value.error { color: var(--primary); }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-box small { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .stat-box span { font-weight: 800; font-size: 1.1rem; }

        .btn {
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 51, 68, 0.3);
        }

        .btn-start { background: var(--primary); color: white; }
        .btn-stop { background: #333; color: white; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .logs {
            width: 100%;
            max-width: 350px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px;
            margin-top: 25px;
            font-family: monospace;
            font-size: 0.75rem;
            height: 120px;
            overflow-y: auto;
            border: 1px solid #2a2e37;
        }

        .log-entry { margin-bottom: 5px; border-left: 2px solid var(--primary); padding-left: 8px; }
        .log-success { border-left-color: var(--success); color: var(--success); }
    </style>
</head>
<body>

    <div class="header">
        <h1>GUARDIAN</h1>
        <p>Sistema de Rastreamento Móvel</p>
    </div>

    <div class="status-card">
        <div class="info-row">
            <span class="label">📡 Status</span>
            <span id="status-text" class="value">AGUARDANDO</span>
        </div>
        <div class="info-row">
            <span class="label">📍 GPS</span>
            <span id="gps-status" class="value">---</span>
        </div>
        <div class="info-row">
            <span class="label">☁️ Servidor</span>
            <span id="server-status" class="value">---</span>
        </div>
    </div>

    <div class="grid-stats">
        <div class="stat-box">
            <small>Bateria</small>
            <span id="stat-bat">--%</span>
        </div>
        <div class="stat-box">
            <small>Precisão</small>
            <span id="stat-acc">--m</span>
        </div>
        <div class="stat-box">
            <small>Latitude</small>
            <span id="stat-lat" style="font-size: 0.9rem;">0.0000</span>
        </div>
        <div class="stat-box">
            <small>Longitude</small>
            <span id="stat-lng" style="font-size: 0.9rem;">0.0000</span>
        </div>
    </div>

    <button id="mainBtn" class="btn btn-start" onclick="toggleTracking()">Iniciar Rastreamento</button>

    <div class="logs" id="logPanel">
        <div class="log-entry">Pronto para iniciar...</div>
    </div>

<script>
    const SB_URL = "https://vmdhfpkjriuehthrvacc.supabase.co/rest/v1/localizacoes";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtZGhmcGtqcml1ZWh0aHJ2YWNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzE1MTEsImV4cCI6MjA5MzU0NzUxMX0.aJrkzShre1xCtH0bnrChyEpLh7S55bDuN7zw2QIrs2w";

    let tracking = false;
    let watchId = null;

    function addLog(msg, type = '') {
        const panel = document.getElementById('logPanel');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type === 'success' ? 'log-success' : ''}`;
        const now = new Date();
        entry.innerText = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')} ${msg}`;
        panel.prepend(entry);
    }

    async function sendToSupabase(data) {
        try {
            const response = await fetch(SB_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SB_KEY,
                    'Authorization': `Bearer ${SB_KEY}`,
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('server-status').innerText = 'CONECTADO';
                document.getElementById('server-status').className = 'value';
                addLog('Localização enviada!', 'success');
            } else {
                const errData = await response.json();
                document.getElementById('server-status').innerText = 'ERRO ' + response.status;
                document.getElementById('server-status').className = 'value error';
                addLog('Erro no servidor: ' + response.status);
                console.error(errData);
            }
        } catch (err) {
            addLog('Erro de conexão!');
            document.getElementById('server-status').innerText = 'OFFLINE';
        }
    }

    function toggleTracking() {
        const btn = document.getElementById('mainBtn');
        
        if (!tracking) {
            if (!navigator.geolocation) {
                alert('GPS não suportado neste aparelho.');
                return;
            }

            tracking = true;
            btn.innerText = 'Parar Rastreamento';
            btn.className = 'btn btn-stop';
            document.getElementById('status-text').innerText = 'ATIVO';
            addLog('Iniciando sensores...');

            watchId = navigator.geolocation.watchPosition(
                async (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    let batteryLevel = 0;

                    try {
                        const battery = await navigator.getBattery();
                        batteryLevel = Math.round(battery.level * 100);
                    } catch(e) {}

                    document.getElementById('stat-lat').innerText = latitude.toFixed(5);
                    document.getElementById('stat-lng').innerText = longitude.toFixed(5);
                    document.getElementById('stat-acc').innerText = Math.round(accuracy) + 'm';
                    document.getElementById('stat-bat').innerText = (batteryLevel || '--') + '%';
                    document.getElementById('gps-status').innerText = 'Sinal OK';

                    sendToSupabase({
                        latitude,
                        longitude,
                        bateria: batteryLevel,
                        precisao: accuracy
                    });
                },
                (err) => {
                    addLog('Erro GPS: ' + err.message);
                    document.getElementById('gps-status').innerText = 'Erro Sinal';
                },
                { enableHighAccuracy: true }
            );
        } else {
            tracking = false;
            navigator.geolocation.clearWatch(watchId);
            btn.innerText = 'Iniciar Rastreamento';
            btn.className = 'btn btn-start';
            document.getElementById('status-text').innerText = 'PARADO';
            addLog('Rastreamento encerrado.');
        }
    }
</script>
</body>
</html>
