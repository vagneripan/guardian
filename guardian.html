<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Control - Painel Administrativo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --sidebar-bg: #111218;
            --accent-green: #00f294;
            --text-main: #e0e0e0;
            --text-dim: #94a3b8;
            --danger: #ff4d4d;
            --card-bg: #1a1b23;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            height: 60px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid #ffffff10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-green);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 242, 148, 0.3);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            background: #00f29415;
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        /* LAYOUT PRINCIPAL */
        main {
            display: flex;
            flex: 1;
        }

        /* SIDEBAR */
        #sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid #ffffff10;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .data-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ffffff05;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .data-label { color: var(--text-dim); }
        .data-value { font-weight: 600; color: var(--accent-green); font-family: monospace; }

        /* BATERIA */
        .battery-container {
            width: 100%;
            height: 6px;
            background: #ffffff10;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        #battery-fill {
            height: 100%;
            background: var(--accent-green);
            width: 0%;
            transition: width 1s ease;
        }

        /* LOGS */
        #log-container {
            flex: 1;
            font-size: 0.75rem;
            color: var(--text-dim);
            overflow-y: auto;
            max-height: 250px;
            padding-right: 5px;
        }

        .log-entry {
            padding: 8px;
            border-left: 2px solid var(--accent-green);
            background: #ffffff05;
            margin-bottom: 5px;
            border-radius: 0 4px 4px 0;
        }

        /* MAPA */
        #map {
            flex: 1;
            background: #0f1115;
        }

        /* CONTROLES FLUTUANTES */
        .map-controls {
            position: absolute;
            top: 80px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-control {
            background: var(--card-bg);
            border: 1px solid #ffffff20;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-control:hover {
            background: var(--accent-green);
            color: var(--bg-dark);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <div>
                <h1 style="font-size: 1.1rem; font-weight: 700;">Guardian Control</h1>
                <p style="font-size: 0.6rem; color: var(--text-dim);">MONITORAMENTO EM TEMPO REAL</p>
            </div>
        </div>
        <div class="status-badge">
            <div class="pulse-dot"></div>
            SISTEMA ONLINE
        </div>
    </header>

    <main>
        <div id="sidebar">
            <div>
                <div class="section-title">📍 Posição Atual</div>
                <div class="data-card">
                    <div class="data-row">
                        <span class="data-label">Latitude</span>
                        <span id="lat-val" class="data-value">- - -</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Longitude</span>
                        <span id="lng-val" class="data-value">- - -</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Precisão</span>
                        <span id="acc-val" class="data-value">- - -</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Atualização</span>
                        <span id="time-val" class="data-value">Aguardando...</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">🔋 Status do Dispositivo</div>
                <div class="data-card">
                    <div class="data-row">
                        <span class="data-label">Bateria</span>
                        <span id="bat-val" class="data-value">0%</span>
                    </div>
                    <div class="battery-container">
                        <div id="battery-fill"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <div class="section-title">📊 Registros</div>
                    <div class="data-card" style="text-align: center;">
                        <span id="count-val" style="font-size: 1.5rem; font-weight: 800; color: var(--accent-green);">0</span>
                    </div>
                </div>
                <div style="flex: 1;">
                    <div class="section-title">📡 Status</div>
                    <div class="data-card" style="text-align: center;">
                        <span style="font-size: 1.2rem; font-weight: 800; color: var(--accent-green);">ON</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">📋 Últimos Eventos</div>
                <div id="log-container">
                    <!-- Logs entrarão aqui -->
                </div>
            </div>
        </div>

        <div id="map"></div>

        <div class="map-controls">
            <button class="btn-control" onclick="centerMap()">🎯 Centralizar</button>
            <button class="btn-control" onclick="clearTrail()">🗑️ Limpar Trilha</button>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // CONFIGURAÇÕES SUPABASE
        const SUPABASE_URL = "https://vmdhfpkjriuehthrvacc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtZGhmcGtqcml1ZWh0aHJ2YWNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzE1MTEsImV4cCI6MjA5MzU0NzUxMX0.aJrkzShre1xCtH0bnrChyEpLh7S55bDuN7zw2QIrs2w";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // VARIÁVEIS DO MAPA
        let map, marker, trailLine;
        let coordsHistory = [];
        let firstLoad = true;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
            
            // Tema Dark Mode
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; CartoDB'
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Estilo do Marcador (Pulsante)
            const pulseIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background-color: #00f294; width: 15px; height: 15px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px #00f294;"></div>`,
                iconSize: [15, 15],
                iconAnchor: [7, 7]
            });

            marker = L.marker([0, 0], { icon: pulseIcon }).addTo(map);
            trailLine = L.polyline([], { color: '#00f294', weight: 3, opacity: 0.6, dashArray: '5, 10' }).addTo(map);
        }

        async function updateDashboard() {
            try {
                const { data, error } = await _supabase
                    .from('localizacoes')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    const latest = data[0];
                    
                    // Atualiza Interface
                    document.getElementById('lat-val').innerText = latest.latitude.toFixed(6);
                    document.getElementById('lng-val').innerText = latest.longitude.toFixed(6);
                    document.getElementById('acc-val').innerText = `±${latest.precisao.toFixed(1)}m`;
                    document.getElementById('bat-val').innerText = `${latest.bateria}%`;
                    document.getElementById('battery-fill').style.width = `${latest.bateria}%`;
                    document.getElementById('count-val').innerText = data.length;
                    document.getElementById('time-val').innerText = new Date(latest.timestamp).toLocaleTimeString();

                    // Atualiza Mapa
                    const pos = [latest.latitude, latest.longitude];
                    marker.setLatLng(pos);

                    // Gerencia Trilha (Histórico)
                    coordsHistory = data.map(item => [item.latitude, item.longitude]);
                    trailLine.setLatLngs(coordsHistory);

                    if (firstLoad) {
                        map.setView(pos, 15);
                        firstLoad = false;
                    }

                    // Atualiza Logs (Apenas os últimos 10)
                    const logContainer = document.getElementById('log-container');
                    logContainer.innerHTML = '';
                    data.slice(0, 10).forEach(entry => {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        div.innerHTML = `
                            <strong>${new Date(entry.timestamp).toLocaleTimeString()}</strong><br>
                            📍 ${entry.latitude.toFixed(4)}, ${entry.longitude.toFixed(4)} | 🔋 ${entry.bateria}%
                        `;
                        logContainer.appendChild(div);
                    });
                }
            } catch (err) {
                console.error("Erro ao buscar dados:", err);
            }
        }

        function centerMap() {
            if (marker) map.panTo(marker.getLatLng());
        }

        async function clearTrail() {
            if (confirm("Deseja limpar o histórico de trilha no mapa? (Isso não apagará os dados do banco)")) {
                trailLine.setLatLngs([]);
            }
        }

        // Inicialização
        initMap();
        updateDashboard();
        setInterval(updateDashboard, 5000); // Atualiza a cada 5 segundos

    </script>
</body>
</html>
